name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: koleya
          POSTGRES_PASSWORD: test
          POSTGRES_DB: koleya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://koleya:test@localhost:5432/koleya_test
      JWT_SECRET: test-secret-ci
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        run: psql -U koleya -d koleya_test -f migrations/001_init.sql
        working-directory: backend
        env:
          PGPASSWORD: test

      - name: Frontend tests
        run: npm test -- --run

      - name: Build
        run: npm run build
